name: Generate Channel from YouTube Search

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Search Keyword OR Playlist URL/ID'
        required: true
        type: string
      channel_id:
        description: 'Channel ID Number (e.g. 3)'
        required: true
        type: string
      channel_name:
        description: 'Channel Name Display (e.g. 2000s Metalcore)'
        required: true
        type: string
      max_results:
        description: 'Number of videos to fetch'
        required: false
        default: '200'
        type: string

permissions:
  contents: write

jobs:
  build-channel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google API package
        run: npm install googleapis

      - name: Fetch YouTube Data & Update JSON
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INPUT_KEYWORD: ${{ inputs.keyword }}
          INPUT_CHANNEL_ID: ${{ inputs.channel_id }}
          INPUT_CHANNEL_NAME: ${{ inputs.channel_name }}
          INPUT_MAX_RESULTS: ${{ inputs.max_results }}
        run: |
          node scripts/generateChannel.js \
            "$INPUT_KEYWORD" \
            "$INPUT_CHANNEL_ID" \
            "$INPUT_CHANNEL_NAME" \
            "$INPUT_MAX_RESULTS"

      - name: Commit and push updated YTchannels.json
        env:
          INPUT_CHANNEL_ID: ${{ inputs.channel_id }}
          INPUT_KEYWORD: ${{ inputs.keyword }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add YTchannels.json
          git commit -m "Auto-update Channel $INPUT_CHANNEL_ID via query/playlist: $INPUT_KEYWORD" || echo "No changes to commit"
          git push
