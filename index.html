<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline TV</title>
  <!-- Includes HLS.js to allow Chrome/Firefox/Edge to play Jellyfin HLS streams seamlessly -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }
    video { width: 100%; height: auto; background: #111; border-radius: 8px; }
    .controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
    select, button {
      padding: 10px 15px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 16px;
    }
    .info { margin-top: 10px; font-size: 14px; color: #aaa; }
  
    #tv-header {
      background-color: #02020a;
      text-align: center;
      padding: 15px 0;
      border-bottom: 2px solid #5a83c2;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      width: 100%;
    }

    #brand-logo {
      height: 150px;
      width: auto;
      display: block;
      margin: 0 auto;
    }

    #tv-guide-container {
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      background-color: #050514;
      border: 1px solid #1a2a4a;
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    #tv-guide-container h2 {
      text-align: center;
      color: #5a83c2;
      margin-top: 0;
      border-bottom: 1px solid #1a2a4a;
      padding-bottom: 10px;
    }

    .epg-row {
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      border-bottom: 1px solid #10182b;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .epg-row:hover {
      background-color: #0d152c;
    }

    .epg-row:last-child {
      border-bottom: none;
    }

    .epg-channel-name {
      font-size: 1.2em;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .epg-shows {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      color: #a0aec0;
      gap: 15px;
    }

    .epg-now {
      color: #48bb78;
    }
  </style>
</head>
<body>
  <header id="tv-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
    <img src="IMG_1942.jpeg" alt="Skyline TV Logo" id="brand-logo" style="margin: 0;">
    <div>
      <a href="guide.html" style="color: #ffcc00; text-decoration: none; font-weight: bold; background: #14244f; padding: 10px 15px; border: 1px solid #2c4a96; border-radius: 6px;">📺 Full TV Guide</a>
    </div>
  </header>

  <div class="container">
    <video id="tvPlayer" controls autoplay muted playsinline></video>
    
    <div class="controls">
      <label for="channelSelect">Channel:</label>
      <select id="channelSelect" onchange="switchChannel()"></select>
      <button onclick="syncPlayback()">Sync Live Offset</button>
    </div>

    <div class="info" id="nowPlaying">Loading schedule...</div>
  </div>

  <div id="tv-guide-container">
    <h2>Live TV Guide</h2>
    <div id="epg-list">Loading guide...</div>
  </div>

<script>
  const JELLYFIN_URL = "https://spread.thepebbles.tech"; 
  
  let scheduleData = null;
  let currentChannelKey = null;
  let hlsEngine = null;

  async function init() {
    try {
      const res = await fetch(`./channels.json?t=${Date.now()}`);
      scheduleData = await res.json();

      const select = document.getElementById('channelSelect');
      select.innerHTML = '';

      const channelKeys = Object.keys(scheduleData.channels);
      if (channelKeys.length === 0) {
        document.getElementById('nowPlaying').innerText = "No channels found in schedule.";
        return;
      }

      channelKeys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = scheduleData.channels[key].name;
        select.appendChild(option);
      });

      currentChannelKey = channelKeys[0];
      syncPlayback();

      // Render the EPG immediately upon loading data
      renderEPG(scheduleData);
    } catch (err) {
      console.error(err);
      document.getElementById('nowPlaying').innerText = "Error loading schedule.";
      document.getElementById('epg-list').innerText = "Failed to load guide data.";
    }
  }

  function syncPlayback() {
    if (!scheduleData || !currentChannelKey) return;

    const channel = scheduleData.channels[currentChannelKey];
    const nowSeconds = Math.floor(Date.now() / 1000);
    const FIXED_EPOCH_SECONDS = 1767225600; 
    
    const elapsedSeconds = (nowSeconds - FIXED_EPOCH_SECONDS) % channel.totalLoopSeconds;

    let activeItem = channel.items[0];
    let seekOffset = 0;

    for (const item of channel.items) {
      const itemEnd = item.start + item.duration;
      if (elapsedSeconds >= item.start && elapsedSeconds < itemEnd) {
        activeItem = item;
        seekOffset = elapsedSeconds - item.start;
        break;
      }
    }

    const player = document.getElementById('tvPlayer');
    const apiKey = scheduleData.apiKey || '';
    
    const streamUrl = `${JELLYFIN_URL}/Videos/${activeItem.id}/master.m3u8?` + 
      `api_key=${apiKey}` +
      `&MediaSourceId=${activeItem.id}` +
      `&VideoCodec=h264` +
      `&AudioCodec=aac` +
      `&AudioChannels=2` +
      `&MaxAudioChannels=2` +
      `&SegmentContainer=ts` +
      `&VideoBitrate=8000000`;

    if (Hls.isSupported()) {
      if (hlsEngine) {
        hlsEngine.destroy();
      }
      hlsEngine = new Hls({
        maxBufferLength: 30,
        maxMaxBufferLength: 60
      });
      
      hlsEngine.loadSource(streamUrl);
      hlsEngine.attachMedia(player);
      
      hlsEngine.on(Hls.Events.MANIFEST_PARSED, function() {
        player.currentTime = seekOffset;
        player.muted = false; 
        
        const playPromise = player.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            player.muted = true;
            player.play();
          });
        }
      });
    } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
      player.src = streamUrl;
      player.currentTime = seekOffset;
      player.play().catch(() => {});
    }

    document.getElementById('nowPlaying').innerText = 
      `Playing: ${activeItem.title} ${activeItem.series ? `(${activeItem.series})` : ''} | Offset: ${Math.floor(seekOffset)}s`;
  }

  function switchChannel() {
    currentChannelKey = document.getElementById('channelSelect').value;
    
    const player = document.getElementById('tvPlayer');
    player.pause();
    
    if (hlsEngine) {
      hlsEngine.detachMedia();
      hlsEngine.destroy();
      hlsEngine = null;
    }

    player.src = "";
    player.load();

    setTimeout(() => {
      syncPlayback();
    }, 150);
  }

  function renderEPG(schedule) {
    const epgList = document.getElementById('epg-list');
    epgList.innerHTML = ''; 

    const nowSeconds = Math.floor(Date.now() / 1000);
    const FIXED_EPOCH_SECONDS = 1767225600; 

    for (const [channelId, channel] of Object.entries(schedule.channels)) {
      const elapsedSeconds = (nowSeconds - FIXED_EPOCH_SECONDS) % channel.totalLoopSeconds;
      
      let activeItem = channel.items[0];
      let nextItem = channel.items[1 % channel.items.length];

      for (let i = 0; i < channel.items.length; i++) {
        const item = channel.items[i];
        if (elapsedSeconds >= item.start && elapsedSeconds < item.start + item.duration) {
          activeItem = item;
          nextItem = channel.items[(i + 1) % channel.items.length];
          break;
        }
      }

      const formatTitle = (item) => item.series ? `${item.series} - ${item.title}` : item.title;

      const row = document.createElement('div');
      row.className = 'epg-row';
      row.innerHTML = `
        <div class="epg-channel-name">${channel.name}</div>
        <div class="epg-shows">
          <span class="epg-now">▶ Now: ${formatTitle(activeItem)}</span>
          <span class="epg-next">Next: ${formatTitle(nextItem)}</span>
        </div>
      `;
      
      // Click row to change channel instantly
      row.style.cursor = 'pointer';
      row.onclick = () => {
        document.getElementById('channelSelect').value = channelId;
        switchChannel();
      };

      epgList.appendChild(row);
    }
  }

  // Auto-refresh guide data every 60 seconds
  setInterval(() => {
    if (scheduleData) renderEPG(scheduleData); 
  }, 60000);

  // Initialize application
  init();
</script>
</body>
</html>
