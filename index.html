<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Live TV</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #player-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <video id="retro-player" controls autoplay></video>
  </div>

  <script>
    let currentScheduleData = null;
    let activeChannelId = 'scream-kids';
    const videoPlayer = document.getElementById('retro-player');

    document.addEventListener('DOMContentLoaded', async () => {
      await loadScheduleData();
      tuneToChannel(activeChannelId);
    });

    async function loadScheduleData() {
      try {
        const response = await fetch('./schedule.json');
        currentScheduleData = await response.json();
      } catch (err) {
        console.error('Failed to load schedule.json:', err);
      }
    }

    function tuneToChannel(channelId) {
      if (!currentScheduleData || !currentScheduleData.channels) return;

      const now = new Date();
      const channel = currentScheduleData.channels.find(c => c.id === channelId);

      if (!channel || !channel.schedule) return;

      const currentProgram = channel.schedule.find(item => {
        const start = new Date(item.startTime);
        const end = new Date(item.endTime);
        return now >= start && now < end;
      });

      if (currentProgram && currentProgram.streamUrl) {
        const startMs = new Date(currentProgram.startTime).getTime();
        const elapsedSeconds = Math.max(0, (now.getTime() - startMs) / 1000);

        videoPlayer.src = currentProgram.streamUrl;
        videoPlayer.currentTime = elapsedSeconds;
        videoPlayer.play().catch(err => console.warn('Autoplay error:', err));
      }
    }
  </script>
</body>
</html>
