<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nostalgex TV</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }
    video { width: 100%; height: auto; background: #111; border-radius: 8px; }
    .controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
    select, button {
      padding: 10px 15px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 16px;
    }
    .info { margin-top: 10px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

<div class="container">
  <video id="tvPlayer" controls autoplay muted playsinline></video>
  
  <div class="controls">
    <label for="channelSelect">Channel:</label>
    <select id="channelSelect" onchange="switchChannel()"></select>
    <button onclick="syncPlayback()">Sync Live Offset</button>
  </div>

  <div class="info" id="nowPlaying">Loading schedule...</div>
</div>

<script>
  // UPDATE THIS with your actual Jellyfin server URL
  const JELLYFIN_URL = "https://spread.thepebbles.tech"; 
  
  let scheduleData = null;
  let currentChannelKey = null;

  async function init() {
    try {
      // Fetch static schedule generated by GitHub Actions
      const res = await fetch(`./channels.json?t=${Date.now()}`);
      scheduleData = await res.json();

      const select = document.getElementById('channelSelect');
      select.innerHTML = '';

      const channelKeys = Object.keys(scheduleData.channels);
      if (channelKeys.length === 0) {
        document.getElementById('nowPlaying').innerText = "No channels found in schedule.";
        return;
      }

      channelKeys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = scheduleData.channels[key].name;
        select.appendChild(option);
      });

      currentChannelKey = channelKeys[0];
      syncPlayback();
    } catch (err) {
      console.error(err);
      document.getElementById('nowPlaying').innerText = "Error loading schedule.";
    }
  }

  function syncPlayback() {
    if (!scheduleData || !currentChannelKey) return;

    const channel = scheduleData.channels[currentChannelKey];
    const nowSeconds = Math.floor(Date.now() / 1000);
    const scheduleStartSeconds = Math.floor(scheduleData.generatedAt / 1000);
    
    // Calculate position in the channel's loop
    const elapsedSeconds = (nowSeconds - scheduleStartSeconds) % channel.totalLoopSeconds;

    let activeItem = channel.items[0];
    let seekOffset = 0;

    for (const item of channel.items) {
      const itemEnd = item.start + item.duration;
      if (elapsedSeconds >= item.start && elapsedSeconds < itemEnd) {
        activeItem = item;
        seekOffset = elapsedSeconds - item.start;
        break;
      }
    }

    const player = document.getElementById('tvPlayer');
    // Set video source directly to Jellyfin stream endpoint
    
    // Switch from static mp4 to Jellyfin's universal HLS master playlist
    const streamUrl = `${JELLYFIN_URL}/Videos/${activeItem.id}/master.m3u8?MediaSourceId=${activeItem.id}`;
    

    
    if (player.src !== streamUrl) {
      player.src = streamUrl;
    }
    
    player.currentTime = seekOffset;
    player.play().catch(() => console.log("Autoplay blocked, tap play to watch."));

    document.getElementById('nowPlaying').innerText = 
      `Playing: ${activeItem.title} ${activeItem.series ? `(${activeItem.series})` : ''} | Offset: ${Math.floor(seekOffset)}s`;
  }

  function switchChannel() {
    currentChannelKey = document.getElementById('channelSelect').value;
    syncPlayback();
  }

  init();
</script>

</body>
</html>
