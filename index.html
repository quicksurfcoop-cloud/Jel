<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline TV</title>
  <!-- Includes HLS.js to allow Chrome/Firefox/Edge to play Jellyfin HLS streams seamlessly -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }
    video { width: 100%; height: auto; background: #111; border-radius: 8px; }
    .controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
    select, button {
      padding: 10px 15px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 16px;
    }
    .info { margin-top: 10px; font-size: 14px; color: #aaa; }
  
  #tv-header {
  background-color: #02020a; /* Deep blue matching the logo edges */
  text-align: center;
  padding: 15px 0;
  border-bottom: 2px solid #5a83c2; /* Light blue accent line */
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  width: 100%;
}

#brand-logo {
  height: 300px; /* Adjust this value to scale the logo up or down */
  width: auto;
  display: block;
  margin: 0 auto;
}

/* Optional: Dark theme for the rest of the body to match the new vibe */
body {
  background-color: #0a0a0a;
  color: #ffffff;
  margin: 0;
  font-family: Arial, sans-serif;
}

  </style>
</head>
<body>
  <header id="tv-header">
  <img src="IMG_1942.jpeg" alt="Skyline TV Logo" id="brand-logo">
</header>


<div class="container">
  <video id="tvPlayer" controls autoplay muted playsinline></video>
  
  <div class="controls">
    <label for="channelSelect">Channel:</label>
    <select id="channelSelect" onchange="switchChannel()"></select>
    <button onclick="syncPlayback()">Sync Live Offset</button>
  </div>

  <div class="info" id="nowPlaying">Loading schedule...</div>
</div>

<script>
  const JELLYFIN_URL = "https://spread.thepebbles.tech"; 
  
  let scheduleData = null;
  let currentChannelKey = null;
  let hlsEngine = null;

  async function init() {
    try {
      const res = await fetch(`./channels.json?t=${Date.now()}`);
      scheduleData = await res.json();

      const select = document.getElementById('channelSelect');
      select.innerHTML = '';

      const channelKeys = Object.keys(scheduleData.channels);
      if (channelKeys.length === 0) {
        document.getElementById('nowPlaying').innerText = "No channels found in schedule.";
        return;
      }

      channelKeys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = scheduleData.channels[key].name;
        select.appendChild(option);
      });

      currentChannelKey = channelKeys[0];
      syncPlayback();
    } catch (err) {
      console.error(err);
      document.getElementById('nowPlaying').innerText = "Error loading schedule.";
    }
  }

  function syncPlayback() {
    if (!scheduleData || !currentChannelKey) return;

    const channel = scheduleData.channels[currentChannelKey];
    const nowSeconds = Math.floor(Date.now() / 1000);
    
    // Fixed reference point (Jan 1, 2026 00:00:00 UTC) so updates don't reset the timeline
    const FIXED_EPOCH_SECONDS = 1767225600; 
    
    const elapsedSeconds = (nowSeconds - FIXED_EPOCH_SECONDS) % channel.totalLoopSeconds;

    let activeItem = channel.items[0];
    let seekOffset = 0;

    for (const item of channel.items) {
      const itemEnd = item.start + item.duration;
      if (elapsedSeconds >= item.start && elapsedSeconds < itemEnd) {
        activeItem = item;
        seekOffset = elapsedSeconds - item.start;
        break;
      }
    }

    const player = document.getElementById('tvPlayer');
    const apiKey = scheduleData.apiKey || '';
    
    // Fully parameterized Jellyfin HLS stream request
    const streamUrl = `${JELLYFIN_URL}/Videos/${activeItem.id}/master.m3u8?` + 
      `api_key=${apiKey}` +
      `&MediaSourceId=${activeItem.id}` +
      `&VideoCodec=h264` +
      `&AudioCodec=aac` +
      `&AudioChannels=2` +
      `&MaxAudioChannels=2` +
      `&SegmentContainer=ts` +
      `&VideoBitrate=8000000`;

    // 1. Desktop / Xbox Edge (Uses Hls.js library)
    if (Hls.isSupported()) {
      if (hlsEngine) {
        hlsEngine.destroy();
      }
      hlsEngine = new Hls({
        maxBufferLength: 30,
        maxMaxBufferLength: 60
      });
      
      hlsEngine.loadSource(streamUrl);
      hlsEngine.attachMedia(player);
      
      hlsEngine.on(Hls.Events.MANIFEST_PARSED, function() {
        player.currentTime = seekOffset;
        player.muted = false; 
        
        const playPromise = player.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            console.log("Autoplay blocked - attempting muted fallback");
            player.muted = true;
            player.play();
          });
        }
      });
    } 
    // 2. Mobile Safari / iOS Native HLS
    else if (player.canPlayType('application/vnd.apple.mpegurl')) {
      player.src = streamUrl;
      player.currentTime = seekOffset;
      player.play().catch(() => console.log("Autoplay blocked"));
    }

    document.getElementById('nowPlaying').innerText = 
      `Playing: ${activeItem.title} ${activeItem.series ? `(${activeItem.series})` : ''} | Offset: ${Math.floor(seekOffset)}s`;
  }

  function switchChannel() {
    currentChannelKey = document.getElementById('channelSelect').value;
    
    const player = document.getElementById('tvPlayer');
    player.pause();
    
    if (hlsEngine) {
      hlsEngine.detachMedia();
      hlsEngine.destroy();
      hlsEngine = null;
    }

    // Clear source completely
    player.src = "";
    player.load();

    // Small delay prevents Xbox Edge hardware decoder pipeline lockups
    setTimeout(() => {
      syncPlayback();
    }, 150);
  }

  init();
</script>

</body>
</html>
