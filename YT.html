<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live YouTube TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    #player-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #player { width: 100%; height: 100%; }

    /* On-Screen Display (OSD) */
    #osd {
      position: absolute;
      top: 40px;
      right: 50px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ffcc;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    #osd.active { opacity: 1; }
    .ch-num { font-size: 2rem; font-weight: bold; color: #00ffcc; }
    .ch-name { font-size: 1.2rem; font-weight: 600; }
    .ch-title { font-size: 0.9rem; color: #ccc; margin-top: 4px; }

    /* Controls Overlay */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }
    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover, button.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

    /* EPG Overlay */
    #epg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #epg-overlay.visible { opacity: 1; pointer-events: auto; }

    .epg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #222;
      padding-bottom: 15px;
    }
    .epg-title { font-size: 1.8rem; font-weight: bold; color: #00ffcc; }
    .epg-clock { font-size: 1.4rem; font-family: monospace; color: #fff; }

    .epg-grid-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      position: relative;
      border: 1px solid #333;
      border-radius: 8px;
      background: #111;
    }

    .epg-timeline-header {
      display: flex;
      height: 40px;
      background: #1a1d24;
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid #333;
    }
    .epg-channel-header-stub {
      min-width: 180px;
      max-width: 180px;
      background: #14161c;
      border-right: 1px solid #333;
      position: sticky;
      left: 0;
      z-index: 6;
    }
    .epg-time-slot {
      min-width: 300px;
      padding: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #888;
      border-right: 1px solid #222;
    }

    .epg-row {
      display: flex;
      height: 60px;
      border-bottom: 1px solid #222;
      position: relative;
    }
    .epg-channel-meta {
      min-width: 180px;
      max-width: 180px;
      background: #161820;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #333;
      position: sticky;
      left: 0;
      z-index: 4;
    }
    .epg-channel-meta .num { font-weight: bold; color: #00ffcc; font-size: 0.85rem; }
    .epg-channel-meta .name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .epg-programs-track { display: flex; position: relative; align-items: center; }

    .epg-program-block {
      position: absolute;
      height: 48px;
      background: #222630;
      border: 1px solid #343a46;
      border-radius: 4px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .epg-program-block:hover { background: #2a303f; border-color: #00ffcc; }
    .epg-program-block.active-now { background: #1c3d3a; border-color: #00ffcc; }
    .epg-program-block .title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .epg-program-block .time { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

    .epg-now-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff3366;
      box-shadow: 0 0 8px #ff3366;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <div id="player"></div>
  </div>

  <div id="osd">
    <div class="ch-num" id="osd-num">CH 01</div>
    <div class="ch-name" id="osd-name">Channel Name</div>
    <div class="ch-title" id="osd-title">Loading...</div>
  </div>

  <div id="controls">
    <button onclick="prevChannel()">▲ CH Prev</button>
    <button onclick="nextChannel()">▼ CH Next</button>
    <button id="mute-btn" onclick="toggleMute()">🔇 Unmute</button>
    <button id="epg-btn" onclick="toggleEPG()">📺 TV Guide (G)</button>
  </div>

  <div id="epg-overlay">
    <div class="epg-header">
      <div class="epg-title">Live Program Guide</div>
      <div class="epg-clock" id="epg-clock">00:00:00</div>
    </div>
    <div class="epg-grid-container" id="epg-grid-container">
      <div class="epg-timeline-header" id="epg-timeline-header">
        <div class="epg-channel-header-stub"></div>
      </div>
      <div id="epg-rows"></div>
      <div class="epg-now-line" id="epg-now-line"></div>
    </div>
  </div>


<script>
function loadVideo(videoIndex) {

    const channel = CHANNELS[currentChannelIdx];

    if (!channel || !channel.playlist.length) {
        return;
    }

    currentVideoIdx = videoIndex;

    if (currentVideoIdx >= channel.playlist.length) {
        currentVideoIdx = 0;
    }

    if (currentVideoIdx < 0) {
        currentVideoIdx = channel.playlist.length - 1;
    }

    const video = channel.playlist[currentVideoIdx];

    console.log("Playing:", video.id);

    player.loadVideoById(video.id);

    showOSD(
        `CH ${String(channel.id).padStart(2, '0')}`,
        channel.name,
        video.title
    );
}
</script>

  <!-- Load YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
