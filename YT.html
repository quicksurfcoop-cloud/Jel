<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TubeNet</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh; /* Dynamic viewport height for mobile browsers */
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* =========================
   APP LAYOUT (FLEXBOX)
   ========================= */

#app-container {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100%;
    height: 100dvh; /* Forces exact fit within visible mobile browser area */
    background-color: #000;
    overflow: hidden;
}

#player-wrapper {
    flex: 1;
    width: 100%;
    position: relative;
    background: #000;
}

#player-wrapper iframe,
#player {
    width: 100% !important;
    height: 100% !important;
    border: none;
}

/* =========================
   DEDICATED BOTTOM BAR
   ========================= */

#control-bar {
    min-height: 60px;
    width: 100%;
    background-color: #111;
    border-top: 1px solid #222;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    flex-shrink: 0;
    padding: 10px 0; /* Ensures buttons aren't cut off on short screens */
}


#controls {
    display: flex;
    gap: 12px;
}

#controls button {
    background: #222;
    color: #fff;
    border: 1px solid #444;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
}

#controls button:hover {
    background: #333;
}

/* =========================
   ON SCREEN DISPLAY
   ========================= */

#osd {
    position: absolute;
    left: 30px;
    bottom: 20px;
    z-index: 20;
    min-width: 330px;
    max-width: 70%;
    padding: 14px 20px;
    background: rgba(0,0,0,.82);
    border-left: 5px solid #fff;
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
}

#osd.visible {
    opacity: 1;
}

#osd-num {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 3px;
}

#osd-name {
    font-size: 25px;
    font-weight: bold;
}

#osd-title {
    margin-top: 5px;
    font-size: 16px;
    color: #ddd;
}

/* =========================
   HORIZONTAL GRID EPG
   ========================= */

#epg {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #111;
    display: none;
    flex-direction: column;
}

#epg.visible {
    display: flex;
}

#epg-header {
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #181818;
    border-bottom: 1px solid #333;
}

#epg-title {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
}

#epg-clock {
    font-size: 18px;
    color: #e50914;
    font-weight: bold;
}

/* Outer Scrollable Grid Container */
#epg-content {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #0a0a0a;
}

.epg-grid {
    display: min-content;
    min-width: 100%;
}

/* Timeline Header Row */
.epg-timeline-row {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 10;
    background: #181818;
    border-bottom: 2px solid #333;
    height: 40px;
}

.epg-timeline-corner {
    width: 140px;
    flex-shrink: 0;
    position: sticky;
    left: 0;
    z-index: 15;
    background: #181818;
    border-right: 1px solid #333;
}

.epg-timeline-slots {
    display: flex;
    position: relative;
}

.time-slot {
    width: 300px; /* 300px per hour scale */
    flex-shrink: 0;
    padding: 10px;
    font-size: 13px;
    font-weight: bold;
    color: #aaa;
    border-right: 1px solid #282828;
}

/* Channel Rows */
.epg-channel-row {
    display: flex;
    height: 70px;
    border-bottom: 1px solid #222;
}

.epg-channel-row.active-channel {
    background: rgba(229, 9, 20, 0.05);
}

.epg-sticky-sidebar {
    width: 140px;
    flex-shrink: 0;
    position: sticky;
    left: 0;
    z-index: 5;
    background: #141414;
    border-right: 1px solid #333;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
}

.epg-sticky-sidebar:hover {
    background: #222;
}

.epg-sidebar-name {
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.epg-sidebar-num {
    font-size: 12px;
    color: #888;
}

/* Track Container for Block Items */
.epg-track {
    position: relative;
    display: flex;
    height: 100%;
}

.epg-block {
    position: absolute;
    top: 4px;
    bottom: 4px;
    background: #1f1f1f;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 8px 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
}

.epg-block:hover {
    background: #2a2a2a;
    border-color: #555;
}

.epg-block.is-now {
    background: #2b1a1c;
    border-color: #e50914;
}

.epg-block-title {
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #fff;
}

.epg-block-time {
    font-size: 11px;
    color: #aaa;
    margin-top: 2px;
}

/* Current Time Red Line Indicator */
.epg-now-indicator {
    position: absolute;
    top: 40px;
    bottom: 0;
    width: 2px;
    background: #e50914;
    z-index: 8;
    pointer-events: none;
}

/* =========================
   MESSAGE
   ========================= */

#message {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    text-align: center;
    padding: 30px;
    font-size: 20px;
}

#message.hidden {
    display: none;
}

#message-inner {
    max-width: 700px;
}

#message-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
}

#message-text {
    color: #aaa;
    line-height: 1.5;
}

/* =========================
   MOBILE ADJUSTMENTS
   ========================= */

@media (max-width: 700px) {

    #control-bar {
        height: 50px;
    }

    #controls {
        gap: 6px;
    }

    #controls button {
        padding: 6px 10px;
        font-size: 12px;
    }

    #osd {
        left: 15px;
        bottom: 15px;
        min-width: 0;
        max-width: calc(100% - 30px);
    }

    #osd-name {
        font-size: 20px;
    }

    #epg-header {
        padding: 0 15px;
    }

    #epg-title {
        font-size: 20px;
    }

    #epg-clock {
        font-size: 16px;
    }

    .epg-channel-name {
        font-size: 17px;
    }

    .epg-time {
        width: 130px;
        padding: 12px 8px;
        font-size: 11px;
    }

    .epg-programme-title {
        font-size: 14px;
    }

    .epg-now {
        width: 55px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div id="app-container">
    <div id="player-wrapper">
        <div id="player"></div>
        <div id="osd">
            <div id="osd-num">CH 01</div>
            <div id="osd-name">Loading...</div>
            <div id="osd-title">Loading...</div>
        </div>
    </div>

    <div id="control-bar">
        <div id="controls">
            <button onclick="prevChannel()">▲ CH Prev</button>
            <button onclick="nextChannel()">▼ CH Next</button>
            <button id="mute-btn" onclick="toggleMute()">🔇 Unmute</button>
            <button onclick="toggleEPG()">📺 TV Guide (G)</button>
        </div>
    </div>
</div>

<div id="epg">
    <div id="epg-header">
        <div id="epg-title">TV GUIDE</div>
        <div id="epg-clock">00:00:00</div>
    </div>
    <div id="epg-content"></div>
</div>

<div id="message">
    <div id="message-inner">
        <div id="message-title">Jel TV</div>
        <div id="message-text">
            Loading channel configuration...
        </div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let CHANNELS = [];

let currentChannelIndex = 0;
let currentVideoIndex = 0;

let player = null;

let youtubeAPIReady = false;
let configurationLoaded = false;

let osdTimer = null;
let epgVisible = false;

let startupSeeking = false;


/* =========================================================
   BROADCAST START
   ========================================================= */

function getBroadcastStart(channel) {
    if (channel && typeof channel.broadcastStart === "string") {
        const parts = channel.broadcastStart.split(":");
        if (parts.length >= 2) {
            const hours = parseInt(parts[0], 10);
            const minutes = parseInt(parts[1], 10);
            if (!isNaN(hours) && !isNaN(minutes)) {
                return hours * 3600 + minutes * 60;
            }
        }
    }
    return 0;
}


/* =========================================================
   LOAD CHANNEL CONFIGURATION
   ========================================================= */

async function loadChannels() {
    try {
        const response = await fetch("./YTchannels.json?v=" + Date.now());

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("YTchannels.json is not an array.");
        }

        if (data.length === 0) {
            throw new Error("YTchannels.json contains no channels.");
        }

        CHANNELS = data;
        configurationLoaded = true;

        console.log("Loaded channels:", CHANNELS);
        hideMessage();

        if (youtubeAPIReady) {
            initPlayer();
        }

    } catch (error) {
        console.error("Could not load YTchannels.json:", error);
        showMessage(
            "Configuration Error",
            "Failed to load YTchannels.json.<br><br>" +
            error.message +
            "<br><br>" +
            "Make sure YTchannels.json is in the same folder as YT.html."
        );
    }
}


/* =========================================================
   YOUTUBE API READY
   ========================================================= */

function onYouTubeIframeAPIReady() {
    console.log("YouTube IFrame API ready.");
    youtubeAPIReady = true;

    if (configurationLoaded) {
        initPlayer();
    }
}


/* =========================================================
   CALCULATE CURRENT BROADCAST POSITION
   ========================================================= */

function calculateBroadcastPosition(channel) {
    if (!channel || !Array.isArray(channel.playlist) || channel.playlist.length === 0) {
        return null;
    }

    const playlist = channel.playlist;
    const broadcastStart = getBroadcastStart(channel);
    const now = new Date();

    const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    let elapsed = currentSeconds - broadcastStart;

    if (elapsed < 0) {
        elapsed += 86400;
    }

    let totalDuration = 0;
    for (let i = 0; i < playlist.length; i++) {
        totalDuration += Number(playlist[i].duration) || 0;
    }

    if (totalDuration > 0) {
        const position = elapsed % totalDuration;
        let accumulated = 0;

        for (let i = 0; i < playlist.length; i++) {
            const duration = Number(playlist[i].duration) || 0;
            if (position < accumulated + duration) {
                return {
                    index: i,
                    offset: position - accumulated,
                    exact: true
                };
            }
            accumulated += duration;
        }
    }

    return {
        index: 0,
        offset: 0,
        exact: false
    };
}


/* =========================================================
   INITIALISE PLAYER
   ========================================================= */

function initPlayer() {
    if (player || !CHANNELS.length) return;

    const channel = CHANNELS[currentChannelIndex];

    if (!channel.playlist || !Array.isArray(channel.playlist) || channel.playlist.length === 0) {
        showMessage("Channel Error", "Channel " + (channel.name || "") + " does not contain a playlist.");
        return;
    }

    const position = calculateBroadcastPosition(channel);
    currentVideoIndex = position ? position.index : 0;

    const video = channel.playlist[currentVideoIndex];

    if (!video || !video.id) {
        showMessage("Video Error", "The selected video does not contain a valid YouTube ID.");
        return;
    }

    console.log("Starting channel:", channel.name);
    console.log("Starting video:", video.id);
    console.log("Calculated broadcast position:", position);

    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: video.id,
        playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            modestbranding: 1,
            rel: 0,
            playsinline: 1,
            fs: 0
        },
        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError
        }
    });
}


/* =========================================================
   PLAYER READY
   ========================================================= */

function onPlayerReady(event) {
    console.log("Player ready.");
    event.target.mute();
    event.target.playVideo();

    updateMuteButton();
    updateOSD();
    buildEPG();

    setTimeout(function() {
        const channel = CHANNELS[currentChannelIndex];
        const position = calculateBroadcastPosition(channel);

        if (position && position.exact && position.offset > 0) {
            startupSeeking = true;
            console.log("Seeking to broadcast position:", position.offset);
            try {
                event.target.seekTo(position.offset, true);
                event.target.playVideo();
            } catch (error) {
                console.warn("Could not seek:", error);
            }
        }
    }, 1500);
}


/* =========================================================
   PLAYER STATE CHANGES
   ========================================================= */

function onPlayerStateChange(event) {
    console.log("Player state:", event.data);

    if (event.data === YT.PlayerState.PLAYING) {
        hideMessage();
        updateOSD();
        buildEPG();
        startupSeeking = false;
    }

    if (event.data === YT.PlayerState.ENDED) {
        console.log("Video ended.");
        playNextVideo();
    }
}


/* =========================================================
   VIDEO ERROR
   ========================================================= */

function onPlayerError(event) {
    console.warn("YouTube video error:", event.data);
    showOSD("Video unavailable — skipping...");

    setTimeout(function() {
        playNextVideo();
    }, 1200);
}


/* =========================================================
   PLAY NEXT VIDEO
   ========================================================= */

function playNextVideo() {
    const channel = CHANNELS[currentChannelIndex];

    if (!channel || !Array.isArray(channel.playlist) || channel.playlist.length === 0) {
        return;
    }

    currentVideoIndex++;
    if (currentVideoIndex >= channel.playlist.length) {
        currentVideoIndex = 0;
    }

    const video = channel.playlist[currentVideoIndex];

    if (!video || !video.id) {
        console.warn("Invalid video entry:", video);
        playNextVideo();
        return;
    }

    console.log("Loading next video:", video.id);

    if (player) {
        player.loadVideoById(video.id, 0);
    }

    buildEPG();
}


/* =========================================================
   LOAD VIDEO WITH OPTIONAL OFFSET
   ========================================================= */

function loadVideo(index, startSeconds = 0) {
    const channel = CHANNELS[currentChannelIndex];

    if (!channel || !channel.playlist || !channel.playlist.length) {
        return;
    }

    currentVideoIndex = index;

    if (currentVideoIndex < 0) {
        currentVideoIndex = channel.playlist.length - 1;
    }

    if (currentVideoIndex >= channel.playlist.length) {
        currentVideoIndex = 0;
    }

    const video = channel.playlist[currentVideoIndex];

    if (!video || !video.id) {
        console.warn("Invalid video:", video);
        playNextVideo();
        return;
    }

    console.log("Loading:", video.id, "at offset:", startSeconds);

    if (player) {
        player.loadVideoById(video.id, startSeconds);
    }

    updateOSD();
    buildEPG();
}


/* =========================================================
   CHANNEL SWITCHING
   ========================================================= */

function switchChannel(targetIndex) {
    if (!CHANNELS.length) return;

    if (targetIndex < 0) {
        targetIndex = CHANNELS.length - 1;
    } else if (targetIndex >= CHANNELS.length) {
        targetIndex = 0;
    }

    currentChannelIndex = targetIndex;

    const channel = CHANNELS[currentChannelIndex];
    const position = calculateBroadcastPosition(channel);

    let videoIndex = 0;
    let startSeconds = 0;

    if (position) {
        videoIndex = position.index;
        if (position.exact && position.offset > 0) {
            startSeconds = position.offset;
        }
    }

    console.log("Switching to channel:", currentChannelIndex, "Video Index:", videoIndex, "Offset:", startSeconds);
    loadVideo(videoIndex, startSeconds);
}

function nextChannel() {
    switchChannel(currentChannelIndex + 1);
}

function prevChannel() {
    switchChannel(currentChannelIndex - 1);
}


/* =========================================================
   MUTE
   ========================================================= */

function toggleMute() {
    if (!player) return;

    if (player.isMuted()) {
        player.unMute();
    } else {
        player.mute();
    }

    updateMuteButton();
}

function updateMuteButton() {
    const button = document.getElementById("mute-btn");
    if (!button || !player) return;

    if (player.isMuted()) {
        button.textContent = "🔊 Unmute";
    } else {
        button.textContent = "🔇 Mute";
    }
}


/* =========================================================
   ON SCREEN DISPLAY
   ========================================================= */

function updateOSD() {
    if (!CHANNELS.length) return;

    const channel = CHANNELS[currentChannelIndex];
    let title = "YouTube video";

    if (player) {
        try {
            const videoData = player.getVideoData();
            if (videoData && videoData.title) {
                title = videoData.title;
            }
        } catch (error) {}
    }

    document.getElementById("osd-num").textContent = "CH " + String(currentChannelIndex + 1).padStart(2, "0");
    document.getElementById("osd-name").textContent = channel.name || "Channel";
    document.getElementById("osd-title").textContent = title;

    showOSD();
}

function showOSD(customTitle) {
    const osd = document.getElementById("osd");

    if (customTitle) {
        document.getElementById("osd-title").textContent = customTitle;
    }

    osd.classList.add("visible");
    clearTimeout(osdTimer);

    osdTimer = setTimeout(function() {
        osd.classList.remove("visible");
    }, 5000);
}


/* =========================================================
   EPG VISIBILITY
   ========================================================= */

function toggleEPG() {
    epgVisible = !epgVisible;
    const epg = document.getElementById("epg");

    if (epgVisible) {
        epg.classList.add("visible");
        buildEPG();
    } else {
        epg.classList.remove("visible");
    }
}


/* =========================================================
   FORMAT DURATION
   ========================================================= */

function formatDuration(seconds) {
    if (!isFinite(seconds) || seconds < 0) {
        return "--:--";
    }

    seconds = Math.floor(seconds);
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    if (hours > 0) {
        return String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
}


/* =========================================================
   FORMAT CLOCK
   ========================================================= */

function formatClock(date) {
    return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });
}


/* =========================================================
   GET VIDEO TITLE
   ========================================================= */

function getVideoTitle(video, index) {
    if (player && index === currentVideoIndex) {
        try {
            const data = player.getVideoData();
            if (data && data.title) {
                return data.title;
            }
        } catch (error) {}
    }

    if (video && video.title) {
        return video.title;
    }

    return "Programme " + (index + 1);
}


/* =========================================================
   BUILD HORIZONTAL GRID EPG
   ========================================================= */

function buildEPG() {
    const container = document.getElementById("epg-content");
    if (!container) return;

    container.innerHTML = "";
    if (!CHANNELS.length) return;

    const PIXELS_PER_SECOND = 300 / 3600; // 300px per hour scale

    const now = new Date();
    const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    // Establish Grid Frame (Starts at 00:00 midnight)
    const grid = document.createElement("div");
    grid.className = "epg-grid";

    // 1. Timeline Header (00:00 to 23:00)
    const timelineRow = document.createElement("div");
    timelineRow.className = "epg-timeline-row";

    const corner = document.createElement("div");
    corner.className = "epg-timeline-corner";
    timelineRow.appendChild(corner);

    const slots = document.createElement("div");
    slots.className = "epg-timeline-slots";

    for (let h = 0; h < 24; h++) {
        const slot = document.createElement("div");
        slot.className = "time-slot";
        const timeStr = String(h).padStart(2, "0") + ":00";
        slot.textContent = timeStr;
        slots.appendChild(slot);
    }
    timelineRow.appendChild(slots);
    grid.appendChild(timelineRow);

    // 2. Channel Rows
    CHANNELS.forEach(function(channel, channelIndex) {
        const row = document.createElement("div");
        row.className = "epg-channel-row";
        if (channelIndex === currentChannelIndex) {
            row.classList.add("active-channel");
        }

        // Sticky Left Sidebar
        const sidebar = document.createElement("div");
        sidebar.className = "epg-sticky-sidebar";
        sidebar.innerHTML = `
            <div class="epg-sidebar-name">${channel.name || 'Channel'}</div>
            <div class="epg-sidebar-num">CH ${String(channelIndex + 1).padStart(2, '0')}</div>
        `;
        sidebar.addEventListener("click", function() {
            switchChannel(channelIndex);
            toggleEPG();
        });
        row.appendChild(sidebar);

        // Track containing timed program blocks
        const track = document.createElement("div");
        track.className = "epg-track";
        track.style.width = (24 * 300) + "px"; // 24 hours width

        const broadcastStartSecs = getBroadcastStart(channel);
        let accumulatedSecs = broadcastStartSecs;

        const count = channel.playlist ? channel.playlist.length : 0;

        for (let i = 0; i < count; i++) {
            const video = channel.playlist[i];
            const duration = Number(video.duration) || 0;

            const startPosSecs = accumulatedSecs;
            const endPosSecs = startPosSecs + duration;

            // Determine if playing right now
            const isNow = currentSeconds >= startPosSecs && currentSeconds < endPosSecs && channelIndex === currentChannelIndex;

            const block = document.createElement("div");
            block.className = "epg-block" + (isNow ? " is-now" : "");

            // Calculate pixel positioning relative to midnight
            const leftPx = startPosSecs * PIXELS_PER_SECOND;
            const widthPx = Math.max(duration * PIXELS_PER_SECOND, 40); // minimum 40px width

            block.style.left = leftPx + "px";
            block.style.width = (widthPx - 4) + "px"; // 4px margin gap

            // Air time formatting
            const startHour = String(Math.floor(startPosSecs / 3600) % 24).padStart(2, "0");
            const startMin = String(Math.floor((startPosSecs % 3600) / 60)).padStart(2, "0");
            const timeFormatted = startHour + ":" + startMin;

            const titleText = getVideoTitle(video, i);

            block.innerHTML = `
                <div class="epg-block-title">${titleText}</div>
                <div class="epg-block-time">${timeFormatted} (${formatDuration(duration)})</div>
            `;

            block.addEventListener("click", function() {
                currentChannelIndex = channelIndex;
                loadVideo(i, 0);
                toggleEPG();
            });

            track.appendChild(block);

            accumulatedSecs += duration;
            if (accumulatedSecs >= 86400) break; // End of 24-hr layout block
        }

        row.appendChild(track);
        grid.appendChild(row);
    });

    // 3. Red "NOW" Line Indicator
    const nowLine = document.createElement("div");
    nowLine.className = "epg-now-indicator";
    const nowLeftPx = 140 + (currentSeconds * PIXELS_PER_SECOND); // 140px sidebar offset
    nowLine.style.left = nowLeftPx + "px";
    grid.appendChild(nowLine);

    container.appendChild(grid);

    // Auto-scroll horizontally to current time position when opened
    setTimeout(function() {
        container.scrollLeft = nowLeftPx - 300;
    }, 50);
}


/* =========================================================
   LIVE EPG UPDATE
   ========================================================= */

setInterval(function() {
    updateClock();
    if (epgVisible) {
        buildEPG();
    }
}, 1000);


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {
    const clock = document.getElementById("epg-clock");
    if (!clock) return;

    clock.textContent = formatClock(new Date());
}


/* =========================================================
   MESSAGES
   ========================================================= */

function showMessage(title, text) {
    document.getElementById("message-title").textContent = title;
    document.getElementById("message-text").innerHTML = text;
    document.getElementById("message").classList.remove("hidden");
}

function hideMessage() {
    document.getElementById("message").classList.add("hidden");
}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowUp") {
        prevChannel();
    } else if (event.key === "ArrowDown") {
        nextChannel();
    } else if (event.key.toLowerCase() === "m") {
        toggleMute();
    } else if (event.key.toLowerCase() === "g") {
        toggleEPG();
    } else if (event.key === "Escape" && epgVisible) {
        toggleEPG();
    }
});


/* =========================================================
   START
   ========================================================= */

updateClock();
loadChannels();

</script>
