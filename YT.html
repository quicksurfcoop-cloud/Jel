<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Jel TV</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;

<body>

<div id="player-wrapper">
    <div id="player"></div>
</div>

<div id="osd">
    <div id="osd-num">CH 01</div>
    <div id="osd-name">Loading...</div>
    <div id="osd-title">Loading...</div>
</div>

<div id="controls">
    <button onclick="prevChannel()">▲ CH Prev</button>
    <button onclick="nextChannel()">▼ CH Next</button>
    <button id="mute-btn" onclick="toggleMute()">🔇 Unmute</button>
    <button onclick="toggleEPG()">📺 TV Guide (G)</button>
</div>

<div id="epg">

    <div id="epg-header">
        <div id="epg-title">TV GUIDE</div>
        <div id="epg-clock">00:00:00</div>
    </div>

    <div id="epg-content"></div>

</div>

<div id="message">
    <div id="message-inner">
        <div id="message-title">Jel TV</div>
        <div id="message-text">
            Loading channel configuration...
        </div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let CHANNELS = [];

let currentChannelIndex = 0;
let currentVideoIndex = 0;

let player = null;

let youtubeAPIReady = false;
let configurationLoaded = false;

let osdTimer = null;
let epgVisible = false;

let epgTimer = null;


/* =========================================================
   LOAD CHANNEL CONFIGURATION
   ========================================================= */

async function loadChannels() {

    try {

        const response = await fetch(
            "./YTchannels.json?v=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "YTchannels.json is not an array."
            );
        }

        if (data.length === 0) {
            throw new Error(
                "YTchannels.json contains no channels."
            );
        }

        CHANNELS = data;

        configurationLoaded = true;

        console.log(
            "Loaded channels:",
            CHANNELS
        );

        hideMessage();

        if (youtubeAPIReady) {
            initPlayer();
        }

    } catch (error) {

        console.error(
            "Could not load YTchannels.json:",
            error
        );

        showMessage(
            "Configuration Error",
            "Failed to load YTchannels.json.<br><br>" +
            error.message +
            "<br><br>" +
            "Make sure YTchannels.json is in the same folder as YT.html."
        );
    }
}


/* =========================================================
   YOUTUBE API READY
   ========================================================= */

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube IFrame API ready."
    );

    youtubeAPIReady = true;

    if (configurationLoaded) {
        initPlayer();
    }
}


/* =========================================================
   INITIALISE PLAYER
   ========================================================= */

function initPlayer() {

    if (player) return;

    if (!CHANNELS.length) return;

    const channel =
        CHANNELS[currentChannelIndex];

    if (
        !channel.playlist ||
        !Array.isArray(channel.playlist) ||
        channel.playlist.length === 0
    ) {

        showMessage(
            "Channel Error",
            "Channel " +
            channel.name +
            " does not contain a playlist."
        );

        return;
    }

    const video =
        channel.playlist[currentVideoIndex];

    if (!video || !video.id) {

        showMessage(
            "Video Error",
            "The first video does not contain a valid YouTube ID."
        );

        return;
    }

    console.log(
        "Starting channel:",
        channel.name
    );

    console.log(
        "Starting video:",
        video.id
    );

    player = new YT.Player(
        "player",
        {

            width: "100%",
            height: "100%",

            videoId: video.id,

            playerVars: {

                autoplay: 1,

                controls: 0,

                disablekb: 1,

                modestbranding: 1,

                rel: 0,

                playsinline: 1,

                fs: 0
            },

            events: {

                onReady:
                    onPlayerReady,

                onStateChange:
                    onPlayerStateChange,

                onError:
                    onPlayerError
            }
        }
    );
}


/* =========================================================
   PLAYER READY
   ========================================================= */

function onPlayerReady(event) {

    console.log(
        "Player ready."
    );

    event.target.mute();

    event.target.playVideo();

    updateMuteButton();

    updateOSD();

    buildEPG();
}


/* =========================================================
   PLAYER STATE CHANGES
   ========================================================= */

function onPlayerStateChange(event) {

    console.log(
        "Player state:",
        event.data
    );

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        updateOSD();

        hideMessage();

        buildEPG();
    }

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        console.log(
            "Video ended. Loading next video."
        );

        playNextVideo();
    }
}


/* =========================================================
   VIDEO ERROR
   ========================================================= */

function onPlayerError(event) {

    console.warn(
        "YouTube video error:",
        event.data
    );

    showOSD(
        "Video unavailable — skipping..."
    );

    setTimeout(
        function() {

            playNextVideo();

        },
        1200
    );
}


/* =========================================================
   PLAY NEXT VIDEO
   ========================================================= */

function playNextVideo() {

    const channel =
        CHANNELS[currentChannelIndex];

    if (
        !channel ||
        !Array.isArray(channel.playlist) ||
        channel.playlist.length === 0
    ) {
        return;
    }

    currentVideoIndex++;

    if (
        currentVideoIndex >=
        channel.playlist.length
    ) {

        currentVideoIndex = 0;
    }

    const video =
        channel.playlist[currentVideoIndex];

    if (!video || !video.id) {

        console.warn(
            "Invalid video entry:",
            video
        );

        playNextVideo();

        return;
    }

    console.log(
        "Loading next video:",
        video.id
    );

    if (player) {

        player.loadVideoById(
            video.id
        );
    }

    buildEPG();
}


/* =========================================================
   LOAD SPECIFIC VIDEO
   ========================================================= */

function loadVideo(index) {

    const channel =
        CHANNELS[currentChannelIndex];

    if (
        !channel ||
        !channel.playlist ||
        !channel.playlist.length
    ) {
        return;
    }

    currentVideoIndex = index;

    if (currentVideoIndex < 0) {

        currentVideoIndex =
            channel.playlist.length - 1;
    }

    if (
        currentVideoIndex >=
        channel.playlist.length
    ) {

        currentVideoIndex = 0;
    }

    const video =
        channel.playlist[currentVideoIndex];

    if (!video || !video.id) {

        console.warn(
            "Invalid video:",
            video
        );

        playNextVideo();

        return;
    }

    console.log(
        "Loading:",
        video.id
    );

    if (player) {

        player.loadVideoById(
            video.id
        );
    }

    updateOSD();

    buildEPG();
}


/* =========================================================
   CHANNEL SWITCHING
   ========================================================= */

function nextChannel() {

    if (!CHANNELS.length) return;

    currentChannelIndex++;

    if (
        currentChannelIndex >=
        CHANNELS.length
    ) {

        currentChannelIndex = 0;
    }

    currentVideoIndex = 0;

    console.log(
        "Next channel:",
        currentChannelIndex
    );

    loadVideo(0);
}


function prevChannel() {

    if (!CHANNELS.length) return;

    currentChannelIndex--;

    if (currentChannelIndex < 0) {

        currentChannelIndex =
            CHANNELS.length - 1;
    }

    currentVideoIndex = 0;

    console.log(
        "Previous channel:",
        currentChannelIndex
    );

    loadVideo(0);
}


/* =========================================================
   MUTE
   ========================================================= */

function toggleMute() {

    if (!player) return;

    if (player.isMuted()) {

        player.unMute();

    } else {

        player.mute();
    }

    updateMuteButton();
}


function updateMuteButton() {

    const button =
        document.getElementById(
            "mute-btn"
        );

    if (!button || !player) return;

    if (player.isMuted()) {

        button.textContent =
            "🔊 Unmute";

    } else {

        button.textContent =
            "🔇 Mute";
    }
}


/* =========================================================
   ON SCREEN DISPLAY
   ========================================================= */

function updateOSD() {

    if (!CHANNELS.length) return;

    const channel =
        CHANNELS[currentChannelIndex];

    let title =
        "YouTube video";

    if (player) {

        try {

            const videoData =
                player.getVideoData();

            if (
                videoData &&
                videoData.title
            ) {

                title =
                    videoData.title;
            }

        } catch (error) {

            console.log(
                "Could not get video title."
            );
        }
    }

    document.getElementById(
        "osd-num"
    ).textContent =
        "CH " +
        String(
            currentChannelIndex + 1
        ).padStart(2, "0");

    document.getElementById(
        "osd-name"
    ).textContent =
        channel.name ||
        "Channel";

    document.getElementById(
        "osd-title"
    ).textContent =
        title;

    showOSD();
}


function showOSD(customTitle) {

    const osd =
        document.getElementById(
            "osd"
        );

    if (customTitle) {

        document.getElementById(
            "osd-title"
        ).textContent =
            customTitle;
    }

    osd.classList.add(
        "visible"
    );

    clearTimeout(osdTimer);

    osdTimer =
        setTimeout(
            function() {

                osd.classList.remove(
                    "visible"
                );

            },
            5000
        );
}


/* =========================================================
   EPG OPEN / CLOSE
   ========================================================= */

function toggleEPG() {

    epgVisible =
        !epgVisible;

    const epg =
        document.getElementById(
            "epg"
        );

    if (epgVisible) {

        epg.classList.add(
            "visible"
        );

        buildEPG();

    } else {

        epg.classList.remove(
            "visible"
        );
    }
}


/* =========================================================
   FORMAT SECONDS
   ========================================================= */

function formatDuration(seconds) {

    if (
        !isFinite(seconds) ||
        seconds < 0
    ) {

        return "--:--";
    }

    seconds =
        Math.floor(seconds);

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* =========================================================
   FORMAT CLOCK TIME
   ========================================================= */

function formatClock(date) {

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );
}


/* =========================================================
   GET VIDEO TITLE
   ========================================================= */

function getVideoTitle(video, index) {

    if (
        player &&
        index === currentVideoIndex
    ) {

        try {

            const data =
                player.getVideoData();

            if (
                data &&
                data.title
            ) {

                return data.title;
            }

        } catch (error) {}
    }

    if (
        video &&
        video.title
    ) {

        return video.title;
    }

    return (
        "Programme " +
        (index + 1)
    );
}


/* =========================================================
   GET VIDEO DURATION
   ========================================================= */

function getVideoDuration(index) {

    const channel =
        CHANNELS[currentChannelIndex];

    if (
        !channel ||
        !channel.playlist
    ) {

        return 0;
    }

    /*
       For the currently playing video,
       YouTube gives us the real duration.
    */

    if (
        player &&
        index === currentVideoIndex
    ) {

        try {

            const duration =
                player.getDuration();

            if (
                duration &&
                isFinite(duration)
            ) {

                return duration;
            }

        } catch (error) {}
    }

    /*
       If the JSON contains a duration,
       use it as a fallback.
    */

    const video =
        channel.playlist[index];

    if (
        video &&
        video.duration
    ) {

        return Number(
            video.duration
        );
    }

    /*
       Unknown duration.
    */

    return 0;
}


/* =========================================================
   BUILD ROLLING EPG
   ========================================================= */

function buildEPG() {

    const container =
        document.getElementById(
            "epg-content"
        );

    if (!container) return;

    container.innerHTML = "";

    if (!CHANNELS.length) return;

    const now =
        new Date();

    CHANNELS.forEach(
        function(channel, channelIndex) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "epg-row";

            if (
                channelIndex ===
                currentChannelIndex
            ) {

                row.classList.add(
                    "current"
                );
            }

            /* CHANNEL HEADER */

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "epg-channel-header";

            const channelName =
                document.createElement(
                    "div"
                );

            channelName.className =
                "epg-channel-name";

            channelName.textContent =
                channel.name ||
                "Channel";

            const channelNumber =
                document.createElement(
                    "div"
                );

            channelNumber.className =
                "epg-channel-number";

            channelNumber.textContent =
                "CH " +
                String(
                    channelIndex + 1
                ).padStart(2, "0");

            header.appendChild(
                channelName
            );

            header.appendChild(
                channelNumber
            );

            row.appendChild(
                header
            );


            /* PROGRAMME LIST */

            const programmes =
                document.createElement(
                    "div"
                );

            programmes.className =
                "epg-programmes";


            /*
               For the current channel we
               know exactly how far into the
               current programme we are.
            */

            let currentOffset = 0;

            if (
                channelIndex ===
                currentChannelIndex &&
                player
            ) {

                try {

                    currentOffset =
                        player.getCurrentTime();

                } catch (error) {

                    currentOffset = 0;
                }
            }


            /*
               Current video's real duration.
               This lets the EPG calculate the
               following programme's time.
            */

            let elapsedInProgramme =
                currentOffset;


            channel.playlist.forEach(
                function(video, videoIndex) {

                    let duration =
                        0;

                    /*
                       Current video:
                       get exact YouTube duration.
                    */

                    if (
                        channelIndex ===
                        currentChannelIndex &&
                        videoIndex ===
                        currentVideoIndex
                    ) {

                        duration =
                            getVideoDuration(
                                videoIndex
                            );

                    } else if (
                        video.duration
                    ) {

                        duration =
                            Number(
                                video.duration
                            );
                    }


                    /*
                       Unknown durations cannot
                       produce exact future times.
                       We display them as TBA.
                    */

                    const isCurrent =
                        channelIndex ===
                        currentChannelIndex &&
                        videoIndex ===
                        currentVideoIndex;


                    /*
                       Calculate programme start.
                       The current programme starts
                       "currentOffset" seconds ago.
                    */

                    let startTime =
                        new Date(
                            now.getTime()
                        );

                    if (
                        channelIndex ===
                        currentChannelIndex
                    ) {

                        let offset =
                            -currentOffset;

                        for (
                            let x = currentVideoIndex - 1;
                            x >= videoIndex;
                            x--
                        ) {

                            const previous =
                                channel.playlist[x];

                            let previousDuration =
                                previous.duration
                                    ? Number(previous.duration)
                                    : 0;

                            offset -=
                                previousDuration;
                        }

                        if (
                            videoIndex >
                            currentVideoIndex
                        ) {

                            offset = 0;

                            for (
                                let x = currentVideoIndex;
                                x < videoIndex;
                                x++
                            ) {

                                const previous =
                                    channel.playlist[x];

                                let previousDuration =
                                    previous.duration
                                        ? Number(previous.duration)
                                        : 0;

                                if (
                                    x ===
                                    currentVideoIndex &&
                                    player
                                ) {

                                    try {

                                        previousDuration =
                                            player.getDuration();

                                    } catch (error) {}
                                }

                                offset +=
                                    previousDuration;
                            }

                            offset -=
                                currentOffset;
                        }

                        startTime =
                            new Date(
                                now.getTime() +
                                offset * 1000
                            );
                    }


                    const programme =
                        document.createElement(
                            "div"
                        );

                    programme.className =
                        "epg-programme";

                    if (isCurrent) {

                        programme.classList.add(
                            "now"
                        );
                    }


                    /* TIME */

                    const time =
                        document.createElement(
                            "div"
                        );

                    time.className =
                        "epg-time";


                    if (
                        duration > 0
                    ) {

                        const endTime =
                            new Date(
                                startTime.getTime() +
                                duration * 1000
                            );

                        time.textContent =
                            formatClock(
                                startTime
                            ) +
                            " – " +
                            formatClock(
                                endTime
                            );

                    } else {

                        time.textContent =
                            formatClock(
                                startTime
                            );
                    }


                    /* PROGRAMME INFO */

                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "epg-programme-info";


                    const title =
                        document.createElement(
                            "div"
                        );

                    title.className =
                        "epg-programme-title";

                    title.textContent =
                        getVideoTitle(
                            video,
                            videoIndex
                        );


                    const meta =
                        document.createElement(
                            "div"
                        );

                    meta.className =
                        "epg-programme-meta";


                    if (duration > 0) {

                        meta.textContent =
                            formatDuration(
                                duration
                            );

                    } else {

                        meta.textContent =
                            "Duration unavailable";
                    }


                    info.appendChild(
                        title
                    );

                    info.appendChild(
                        meta
                    );


                    /* NOW / NEXT */

                    const nowLabel =
                        document.createElement(
                            "div"
                        );

                    nowLabel.className =
                        "epg-now";

                    if (isCurrent) {

                        nowLabel.textContent =
                            "▶ NOW";

                    } else if (
                        videoIndex ===
                        currentVideoIndex + 1
                    ) {

                        nowLabel.textContent =
                            "NEXT";
                    }


                    /* PROGRESS */

                    if (isCurrent) {

                        const progress =
                            document.createElement(
                                "div"
                            );

                        progress.className =
                            "epg-progress";

                        let percentage = 0;

                        if (
                            duration > 0 &&
                            currentOffset >= 0
                        ) {

                            percentage =
                                Math.min(
                                    100,
                                    (
                                        currentOffset /
                                        duration
                                    ) * 100
                                );
                        }

                        progress.style.width =
                            percentage + "%";

                        programme.appendChild(
                            progress
                        );
                    }


                    programme.appendChild(
                        time
                    );

                    programme.appendChild(
                        info
                    );

                    programme.appendChild(
                        nowLabel
                    );


                    programmes.appendChild(
                        programme
                    );
                }
            );


            row.appendChild(
                programmes
            );


            /*
               Clicking a channel in the guide
               changes to that channel.
            */

            header.addEventListener(
                "click",
                function() {

                    currentChannelIndex =
                        channelIndex;

                    currentVideoIndex = 0;

                    loadVideo(0);

                    toggleEPG();
                }
            );


            container.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   EPG LIVE UPDATE
   ========================================================= */

function updateEPGLive() {

    if (!epgVisible) return;

    buildEPG();
}


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {

    const clock =
        document.getElementById(
            "epg-clock"
        );

    const now =
        new Date();

    clock.textContent =
        formatClock(now);
}


/* =========================================================
   MESSAGES
   ========================================================= */

function showMessage(
    title,
    text
) {

    document.getElementById(
        "message-title"
    ).textContent =
        title;

    document.getElementById(
        "message-text"
    ).innerHTML =
        text;

    document.getElementById(
        "message"
    ).classList.remove(
        "hidden"
    );
}


function hideMessage() {

    document.getElementById(
        "message"
    ).classList.add(
        "hidden"
    );
}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowUp"
        ) {

            prevChannel();

        } else if (
            event.key ===
            "ArrowDown"
        ) {

            nextChannel();

        } else if (
            event.key.toLowerCase() ===
            "m"
        ) {

            toggleMute();

        } else if (
            event.key.toLowerCase() ===
            "g"
        ) {

            toggleEPG();

        } else if (
            event.key ===
            "Escape" &&
            epgVisible
        ) {

            toggleEPG();
        }
    }
);


/* =========================================================
   TIMERS
   ========================================================= */

setInterval(
    updateClock,
    1000
);

setInterval(
    updateEPGLive,
    5000
);

updateClock();

loadChannels();

</script>
