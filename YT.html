<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live YouTube TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    #player-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #player { width: 100%; height: 100%; }

    /* On-Screen Display (OSD) */
    #osd {
      position: absolute;
      top: 40px;
      right: 50px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ffcc;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    #osd.active { opacity: 1; }
    .ch-num { font-size: 2rem; font-weight: bold; color: #00ffcc; }
    .ch-name { font-size: 1.2rem; font-weight: 600; }
    .ch-title { font-size: 0.9rem; color: #ccc; margin-top: 4px; }

    /* Controls Overlay */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }
    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover, button.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

    /* EPG Overlay */
    #epg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #epg-overlay.visible { opacity: 1; pointer-events: auto; }

    .epg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #222;
      padding-bottom: 15px;
    }
    .epg-title { font-size: 1.8rem; font-weight: bold; color: #00ffcc; }
    .epg-clock { font-size: 1.4rem; font-family: monospace; color: #fff; }

    .epg-grid-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      position: relative;
      border: 1px solid #333;
      border-radius: 8px;
      background: #111;
    }

    .epg-timeline-header {
      display: flex;
      height: 40px;
      background: #1a1d24;
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid #333;
    }
    .epg-channel-header-stub {
      min-width: 180px;
      max-width: 180px;
      background: #14161c;
      border-right: 1px solid #333;
      position: sticky;
      left: 0;
      z-index: 6;
    }
    .epg-time-slot {
      min-width: 300px;
      padding: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #888;
      border-right: 1px solid #222;
    }

    .epg-row {
      display: flex;
      height: 60px;
      border-bottom: 1px solid #222;
      position: relative;
    }
    .epg-channel-meta {
      min-width: 180px;
      max-width: 180px;
      background: #161820;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #333;
      position: sticky;
      left: 0;
      z-index: 4;
    }
    .epg-channel-meta .num { font-weight: bold; color: #00ffcc; font-size: 0.85rem; }
    .epg-channel-meta .name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .epg-programs-track { display: flex; position: relative; align-items: center; }

    .epg-program-block {
      position: absolute;
      height: 48px;
      background: #222630;
      border: 1px solid #343a46;
      border-radius: 4px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .epg-program-block:hover { background: #2a303f; border-color: #00ffcc; }
    .epg-program-block.active-now { background: #1c3d3a; border-color: #00ffcc; }
    .epg-program-block .title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .epg-program-block .time { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

    .epg-now-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff3366;
      box-shadow: 0 0 8px #ff3366;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <div id="player"></div>
  </div>

  <div id="osd">
    <div class="ch-num" id="osd-num">CH 01</div>
    <div class="ch-name" id="osd-name">Channel Name</div>
    <div class="ch-title" id="osd-title">Loading...</div>
  </div>

  <div id="controls">
    <button onclick="prevChannel()">▲ CH Prev</button>
    <button onclick="nextChannel()">▼ CH Next</button>
    <button id="mute-btn" onclick="toggleMute()">🔇 Unmute</button>
    <button id="epg-btn" onclick="toggleEPG()">📺 TV Guide (G)</button>
  </div>

  <div id="epg-overlay">
    <div class="epg-header">
      <div class="epg-title">Live Program Guide</div>
      <div class="epg-clock" id="epg-clock">00:00:00</div>
    </div>
    <div class="epg-grid-container" id="epg-grid-container">
      <div class="epg-timeline-header" id="epg-timeline-header">
        <div class="epg-channel-header-stub"></div>
      </div>
      <div id="epg-rows"></div>
      <div class="epg-now-line" id="epg-now-line"></div>
    </div>
  </div>


<script>
    const PIXELS_PER_MINUTE = 10;

    let CHANNELS = [];
    let currentChannelIdx = 0;
    let player = null;
    let osdTimer = null;
    let epgVisible = false;
    let epgStartTimestamp = 0;
    let isApiReady = false;
    let playerInitialised = false;


    /*
     * ============================================================
     * LOAD CHANNEL CONFIGURATION
     * ============================================================
     */

    async function loadChannelData() {

        try {

            const response =
                await fetch('./YTchannels.json?v=' + Date.now());

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}: Failed to fetch YTchannels.json`
                );
            }


            const text = await response.text();

            console.log('YTchannels.json received:', text);


            CHANNELS = JSON.parse(text);


            if (!Array.isArray(CHANNELS)) {

                throw new Error(
                    'YTchannels.json must contain an array'
                );
            }


            if (CHANNELS.length === 0) {

                throw new Error(
                    'YTchannels.json contains no channels'
                );
            }


            console.log(
                'Loaded channels:',
                CHANNELS
            );


            if (isApiReady) {
                initPlayer();
            }

        } catch (err) {

            console.error(
                'Error loading YTchannels.json:',
                err
            );


            showOSD(
                'ERR',
                'Config Error',
                err.message
            );
        }
    }


    /*
     * ============================================================
     * YOUTUBE IFRAME API
     * ============================================================
     */

    function onYouTubeIframeAPIReady() {

        console.log(
            'YouTube IFrame API ready'
        );


        isApiReady = true;


        if (
            CHANNELS.length > 0 &&
            !playerInitialised
        ) {

            initPlayer();
        }
    }


    function initPlayer() {

        if (playerInitialised) {
            return;
        }


        if (!isApiReady) {

            console.log(
                'Waiting for YouTube API...'
            );

            return;
        }


        if (!CHANNELS.length) {

            console.log(
                'Waiting for channel configuration...'
            );

            return;
        }


        const channel =
            CHANNELS[currentChannelIdx];


        if (!channel.youtubePlaylist) {

            console.error(
                'Channel does not contain youtubePlaylist:',
                channel
            );


            showOSD(
                'ERR',
                channel.name || 'Channel Error',
                'No YouTube playlist ID'
            );

            return;
        }


        console.log(
            'Creating YouTube player'
        );

        console.log(
            'Channel:',
            channel.name
        );

        console.log(
            'Playlist:',
            channel.youtubePlaylist
        );


        playerInitialised = true;


        player = new YT.Player(
            'player',
            {

                width: '100%',
                height: '100%',


                playerVars: {

                    autoplay: 1,

                    controls: 0,

                    disablekb: 1,

                    modestbranding: 1,

                    rel: 0,

                    mute: 1,

                    listType: 'playlist',

                    list: channel.youtubePlaylist
                },


                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError
                }
            }
        );
    }


    /*
     * ============================================================
     * PLAYER READY
     * ============================================================
     */

    function onPlayerReady(event) {

        console.log(
            'YouTube player ready'
        );


        try {

            event.target.setLoop(true);

            event.target.playVideo();

        } catch (err) {

            console.warn(
                'Could not start playlist:',
                err
            );
        }


        const channel =
            CHANNELS[currentChannelIdx];


        showOSD(

            `CH ${String(channel.id).padStart(2, '0')}`,

            channel.name,

            'Loading playlist...'
        );


        syncMuteButtonState();
    }


    /*
     * ============================================================
     * PLAYER STATE
     * ============================================================
     */

    function onPlayerStateChange(event) {

        console.log(
            'YouTube player state:',
            event.data
        );


        if (
            event.data ===
            YT.PlayerState.PLAYING
        ) {

            updateCurrentProgramme();
        }


        if (
            event.data ===
            YT.PlayerState.ENDED
        ) {

            console.log(
                'Playlist/video ended'
            );


            try {

                player.nextVideo();

            } catch (err) {

                console.warn(
                    'Could not advance playlist:',
                    err
                );
            }
        }
    }


    /*
     * ============================================================
     * YOUTUBE ERROR
     * ============================================================
     */

    function onPlayerError(event) {

        console.error(
            'YouTube player error:',
            event.data
        );


        const channel =
            CHANNELS[currentChannelIdx];


        if (!channel) {
            return;
        }


        let message =
            'YouTube playback error';


        switch (event.data) {

            case 2:
                message =
                    'Invalid YouTube request';
                break;

            case 5:
                message =
                    'HTML5 player error';
                break;

            case 100:
                message =
                    'Video unavailable';
                break;

            case 101:
            case 150:
                message =
                    'Video cannot be embedded';
                break;

            case 153:
                message =
                    'YouTube requires player identification';
                break;
        }


        showOSD(

            `CH ${String(channel.id).padStart(2, '0')}`,

            channel.name,

            message
        );


        /*
         * Give YouTube a chance to move to the next
         * playlist item rather than changing channel.
         */

        setTimeout(() => {

            if (!player) {
                return;
            }


            try {

                player.nextVideo();

            } catch (err) {

                console.warn(
                    'Could not advance playlist:',
                    err
                );
            }

        }, 2000);
    }


    /*
     * ============================================================
     * LOAD CHANNEL
     * ============================================================
     */

    function loadChannel(index) {

        if (
            !CHANNELS.length ||
            !player
        ) {

            return;
        }


        currentChannelIdx = index;


        const channel =
            CHANNELS[currentChannelIdx];


        console.log(
            'Switching channel:',
            channel.name
        );


        console.log(
            'Playlist:',
            channel.youtubePlaylist
        );


        if (!channel.youtubePlaylist) {

            showOSD(

                `CH ${String(channel.id).padStart(2, '0')}`,

                channel.name,

                'No YouTube playlist configured'
            );

            return;
        }


        /*
         * YouTube's IFrame API accepts the playlist ID
         * directly here.
         */

        player.loadPlaylist(
            channel.youtubePlaylist,
            0
        );


        try {

            player.setLoop(true);

            player.playVideo();

        } catch (err) {

            console.warn(
                'Could not start channel:',
                err
            );
        }


        showOSD(

            `CH ${String(channel.id).padStart(2, '0')}`,

            channel.name,

            'Loading playlist...'
        );


        syncMuteButtonState();


        if (epgVisible) {
            renderEPG();
        }
    }


    /*
     * ============================================================
     * CURRENT PROGRAMME
     * ============================================================
     */

    function updateCurrentProgramme() {

        if (
            !player ||
            !CHANNELS.length
        ) {

            return;
        }


        const channel =
            CHANNELS[currentChannelIdx];


        let title =
            'YouTube Playlist';


        try {

            const videoData =
                player.getVideoData();


            if (
                videoData &&
                videoData.title
            ) {

                title =
                    videoData.title;
            }

        } catch (err) {

            console.warn(
                'Could not read video information:',
                err
            );
        }


        showOSD(

            `CH ${String(channel.id).padStart(2, '0')}`,

            channel.name,

            title
        );
    }


    /*
     * ============================================================
     * ON-SCREEN DISPLAY
     * ============================================================
     */

    function showOSD(
        num,
        name,
        title
    ) {

        const numElement =
            document.getElementById('osd-num');

        const nameElement =
            document.getElementById('osd-name');

        const titleElement =
            document.getElementById('osd-title');

        const osd =
            document.getElementById('osd');


        if (
            !numElement ||
            !nameElement ||
            !titleElement ||
            !osd
        ) {

            return;
        }


        numElement.innerText =
            num;

        nameElement.innerText =
            name;

        titleElement.innerText =
            title;


        osd.classList.add(
            'active'
        );


        clearTimeout(
            osdTimer
        );


        osdTimer =
            setTimeout(
                () =>
                    osd.classList.remove(
                        'active'
                    ),
                3500
            );
    }


    /*
     * ============================================================
     * MUTE
     * ============================================================
     */

    function toggleMute() {

        if (!player) {
            return;
        }


        const muteBtn =
            document.getElementById(
                'mute-btn'
            );


        if (player.isMuted()) {

            player.unMute();

            player.setVolume(100);


            muteBtn.innerText =
                '🔊 Mute';


            muteBtn.classList.add(
                'active'
            );

        } else {

            player.mute();


            muteBtn.innerText =
                '🔇 Unmute';


            muteBtn.classList.remove(
                'active'
            );
        }
    }


    function syncMuteButtonState() {

        const muteBtn =
            document.getElementById(
                'mute-btn'
            );


        if (
            !player ||
            !muteBtn
        ) {

            return;
        }


        if (player.isMuted()) {

            muteBtn.innerText =
                '🔇 Unmute';


            muteBtn.classList.remove(
                'active'
            );

        } else {

            muteBtn.innerText =
                '🔊 Mute';


            muteBtn.classList.add(
                'active'
            );
        }
    }


    /*
     * ============================================================
     * CHANNEL UP / DOWN
     * ============================================================
     */

    function nextChannel() {

        if (!CHANNELS.length) {
            return;
        }


        currentChannelIdx =
            (
                currentChannelIdx + 1
            ) %
            CHANNELS.length;


        loadChannel(
            currentChannelIdx
        );
    }


    function prevChannel() {

        if (!CHANNELS.length) {
            return;
        }


        currentChannelIdx =
            (
                currentChannelIdx -
                1 +
                CHANNELS.length
            ) %
            CHANNELS.length;


        loadChannel(
            currentChannelIdx
        );
    }


    /*
     * ============================================================
     * TV GUIDE
     * ============================================================
     */

    function toggleEPG() {

        epgVisible =
            !epgVisible;


        const overlay =
            document.getElementById(
                'epg-overlay'
            );


        const btn =
            document.getElementById(
                'epg-btn'
            );


        if (epgVisible) {

            overlay.classList.add(
                'visible'
            );

            btn.classList.add(
                'active'
            );

            renderEPG();

        } else {

            overlay.classList.remove(
                'visible'
            );

            btn.classList.remove(
                'active'
            );
        }
    }


    function renderEPG() {

        const headerContainer =
            document.getElementById(
                'epg-timeline-header'
            );


        headerContainer.innerHTML =
            '<div class="epg-channel-header-stub"></div>';


        const now =
            new Date();


        now.setMinutes(

            now.getMinutes() < 30
                ? 0
                : 30,

            0,
            0
        );


        epgStartTimestamp =
            Math.floor(
                now.getTime() / 1000
            ) - 1800;


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const slotTime =
                new Date(

                    (
                        epgStartTimestamp +
                        i * 1800
                    ) * 1000
                );


            const timeStr =
                slotTime.toLocaleTimeString(
                    [],
                    {
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                );


            const slotDiv =
                document.createElement(
                    'div'
                );


            slotDiv.className =
                'epg-time-slot';


            slotDiv.innerText =
                timeStr;


            headerContainer.appendChild(
                slotDiv
            );
        }


        const rowsContainer =
            document.getElementById(
                'epg-rows'
            );


        rowsContainer.innerHTML =
            '';


        CHANNELS.forEach(
            (channel, chIdx) => {

                const row =
                    document.createElement(
                        'div'
                    );


                row.className =
                    'epg-row';


                const meta =
                    document.createElement(
                        'div'
                    );


                meta.className =
                    'epg-channel-meta';


                meta.innerHTML = `

                    <div class="num">
                        CH ${String(channel.id).padStart(2, '0')}
                    </div>

                    <div class="name">
                        ${channel.name}
                    </div>

                `;


                row.appendChild(
                    meta
                );


                const track =
                    document.createElement(
                        'div'
                    );


                track.className =
                    'epg-programs-track';


                const block =
                    document.createElement(
                        'div'
                    );


                block.className =
                    'epg-program-block active-now';


                block.style.left =
                    '0px';


                block.style.width =
                    '600px';


                block.innerHTML = `

                    <div class="title">
                        YouTube Playlist
                    </div>

                    <div class="time">
                        Continuous channel
                    </div>

                `;


                block.onclick =
                    () => {

                        loadChannel(
                            chIdx
                        );

                        toggleEPG();
                    };


                track.appendChild(
                    block
                );


                row.appendChild(
                    track
                );


                rowsContainer.appendChild(
                    row
                );
            }
        );


        updateEPGNowLine();
    }


    function updateEPGNowLine() {

        if (!epgVisible) {
            return;
        }


        const nowSec =
            Math.floor(
                Date.now() / 1000
            );


        const offsetSec =
            nowSec -
            epgStartTimestamp;


        const leftPx =
            180 +
            (
                (
                    offsetSec / 60
                ) *
                PIXELS_PER_MINUTE
            );


        const nowLine =
            document.getElementById(
                'epg-now-line'
            );


        nowLine.style.left =
            `${leftPx}px`;


        document.getElementById(
            'epg-clock'
        ).innerText =
            new Date().toLocaleTimeString();
    }


    /*
     * ============================================================
     * TV GUIDE CLOCK
     * ============================================================
     */

    setInterval(
        () => {

            if (epgVisible) {

                updateEPGNowLine();
            }

        },
        1000
    );


    /*
     * ============================================================
     * KEYBOARD CONTROLS
     * ============================================================
     */

    window.addEventListener(
        'keydown',
        (e) => {

            if (
                e.key === 'ArrowUp'
            ) {

                prevChannel();
            }


            if (
                e.key === 'ArrowDown'
            ) {

                nextChannel();
            }


            if (
                e.key.toLowerCase() === 'g' ||
                e.key.toLowerCase() === 'e'
            ) {

                toggleEPG();
            }


            if (
                e.key.toLowerCase() === 'm'
            ) {

                toggleMute();
            }
        }
    );


    /*
     * ============================================================
     * START
     * ============================================================
     */

    loadChannelData();


</script>

  <!-- Load YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
