<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jel TV</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#player-wrapper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 1;
}

#player {
    width: 100%;
    height: 100%;
}

/* =========================
   ON SCREEN DISPLAY
   ========================= */

#osd {
    position: fixed;
    left: 30px;
    bottom: 45px;
    z-index: 20;
    min-width: 330px;
    max-width: 70%;
    padding: 14px 20px;
    background: rgba(0,0,0,.82);
    border-left: 5px solid #fff;
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
}

#osd.visible {
    opacity: 1;
}

#osd-num {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 3px;
}

#osd-name {
    font-size: 25px;
    font-weight: bold;
}

#osd-title {
    margin-top: 5px;
    font-size: 16px;
    color: #ddd;
}

/* =========================
   CONTROLS
   ========================= */

#controls {
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity .25s ease;
}

body:hover #controls {
    opacity: 1;
}

#controls button {
    background: rgba(0,0,0,.8);
    color: white;
    border: 1px solid #555;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
}

#controls button:hover {
    background: #333;
}

/* =========================
   EPG
   ========================= */

#epg {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.97);
    display: none;
    flex-direction: column;
}

#epg.visible {
    display: flex;
}

#epg-header {
    height: 75px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    border-bottom: 1px solid #444;
}

#epg-title {
    font-size: 28px;
    font-weight: bold;
}

#epg-clock {
    font-size: 22px;
}

#epg-content {
    flex: 1;
    overflow: auto;
    padding: 20px;
}

.epg-row {
    margin-bottom: 18px;
    border: 1px solid #333;
    background: #111;
}

.epg-row.current {
    border-color: #fff;
}

.epg-channel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: #181818;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.epg-channel-name {
    font-size: 20px;
    font-weight: bold;
}

.epg-channel-number {
    font-size: 15px;
    color: #aaa;
}

.epg-programmes {
    padding: 0;
}

.epg-programme {
    display: flex;
    min-height: 70px;
    border-bottom: 1px solid #222;
    position: relative;
}

.epg-programme:last-child {
    border-bottom: none;
}

.epg-programme.now {
    background: #202020;
}

.epg-time {
    width: 145px;
    flex-shrink: 0;
    padding: 15px;
    color: #aaa;
    font-size: 14px;
}

.epg-programme-info {
    flex: 1;
    min-width: 0;
    padding: 13px 15px;
}

.epg-programme-title {
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.epg-programme-meta {
    margin-top: 5px;
    color: #888;
    font-size: 13px;
}

.epg-now {
    width: 80px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.epg-progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    background: #fff;
    width: 0%;
    transition: width .5s linear;
}

/* =========================
   MESSAGE
   ========================= */

#message {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    text-align: center;
    padding: 30px;
    font-size: 20px;
}

#message.hidden {
    display: none;
}

#message-inner {
    max-width: 700px;
}

#message-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
}

#message-text {
    color: #aaa;
    line-height: 1.5;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width:700px) {

    #osd {
        left: 15px;
        bottom: 70px;
        min-width: 0;
        max-width: calc(100% - 30px);
    }

    #osd-name {
        font-size: 20px;
    }

    #controls {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    #controls button {
        padding: 7px 10px;
        font-size: 12px;
    }

    #epg-header {
        padding: 0 15px;
    }

    #epg-title {
        font-size: 20px;
    }

    #epg-clock {
        font-size: 16px;
    }

    .epg-channel-name {
        font-size: 17px;
    }

    .epg-time {
        width: 100px;
        padding: 12px 8px;
        font-size: 12px;
    }

    .epg-programme-title {
        font-size: 14px;
    }

    .epg-now {
        width: 55px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div id="player-wrapper">
    <div id="player"></div>
</div>

<div id="osd">
    <div id="osd-num">CH 01</div>
    <div id="osd-name">Loading...</div>
    <div id="osd-title">Loading...</div>
</div>

<div id="controls">
    <button onclick="prevChannel()">▲ CH Prev</button>
    <button onclick="nextChannel()">▼ CH Next</button>
    <button id="mute-btn" onclick="toggleMute()">🔇 Unmute</button>
    <button onclick="toggleEPG()">📺 TV Guide (G)</button>
</div>

<div id="epg">

    <div id="epg-header">
        <div id="epg-title">TV GUIDE</div>
        <div id="epg-clock">00:00:00</div>
    </div>

    <div id="epg-content"></div>

</div>

<div id="message">
    <div id="message-inner">
        <div id="message-title">Jel TV</div>
        <div id="message-text">
            Loading channel configuration...
        </div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let CHANNELS = [];

let currentChannelIndex = 0;
let currentVideoIndex = 0;

let player = null;

let youtubeAPIReady = false;
let configurationLoaded = false;

let osdTimer = null;
let epgVisible = false;

let startupSeeking = false;


/* =========================================================
   BROADCAST START
   ========================================================= */

function getBroadcastStart(channel) {

    if (
        channel &&
        typeof channel.broadcastStart === "string"
    ) {

        const parts =
            channel.broadcastStart.split(":");

        if (parts.length >= 2) {

            const hours =
                parseInt(parts[0], 10);

            const minutes =
                parseInt(parts[1], 10);

            if (
                !isNaN(hours) &&
                !isNaN(minutes)
            ) {

                return (
                    hours * 3600 +
                    minutes * 60
                );
            }
        }
    }

    return 0;
}


/* =========================================================
   LOAD CHANNEL CONFIGURATION
   ========================================================= */

async function loadChannels() {

    try {

        const response =
            await fetch(
                "./YTchannels.json?v=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {

            throw new Error(
                "YTchannels.json is not an array."
            );
        }

        if (data.length === 0) {

            throw new Error(
                "YTchannels.json contains no channels."
            );
        }

        CHANNELS = data;

        configurationLoaded = true;

        console.log(
            "Loaded channels:",
            CHANNELS
        );

        hideMessage();

        if (youtubeAPIReady) {

            initPlayer();
        }

    } catch (error) {

        console.error(
            "Could not load YTchannels.json:",
            error
        );

        showMessage(
            "Configuration Error",
            "Failed to load YTchannels.json.<br><br>" +
            error.message +
            "<br><br>" +
            "Make sure YTchannels.json is in the same folder as YT.html."
        );
    }
}


/* =========================================================
   YOUTUBE API READY
   ========================================================= */

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube IFrame API ready."
    );

    youtubeAPIReady = true;

    if (configurationLoaded) {

        initPlayer();
    }
}


/* =========================================================
   CALCULATE CURRENT BROADCAST POSITION
   ========================================================= */

function calculateBroadcastPosition(channel) {

    if (
        !channel ||
        !Array.isArray(channel.playlist) ||
        channel.playlist.length === 0
    ) {

        return null;
    }

    const playlist =
        channel.playlist;

    const broadcastStart =
        getBroadcastStart(channel);

    const now =
        new Date();

    const currentSeconds =
        now.getHours() * 3600 +
        now.getMinutes() * 60 +
        now.getSeconds();

    let elapsed =
        currentSeconds -
        broadcastStart;

    if (elapsed < 0) {

        elapsed += 86400;
    }

    let totalDuration = 0;

    for (let i = 0; i < playlist.length; i++) {

        const video = playlist[i];

        const duration = Number(video.duration) || 0;

        totalDuration += duration;
    }

    if (totalDuration > 0) {

        const position =
            elapsed %
            totalDuration;

        let accumulated = 0;

        for (let i = 0; i < playlist.length; i++) {

            const duration = Number(playlist[i].duration) || 0;

            if (position < accumulated + duration) {

                return {

                    index: i,

                    offset: position - accumulated,

                    exact: true
                };
            }

            accumulated += duration;
        }
    }

    return {

        index: 0,

        offset: 0,

        exact: false
    };
}


/* =========================================================
   INITIALISE PLAYER
   ========================================================= */

function initPlayer() {

    if (player) return;

    if (!CHANNELS.length) return;

    const channel =
        CHANNELS[currentChannelIndex];

    if (
        !channel.playlist ||
        !Array.isArray(channel.playlist) ||
        channel.playlist.length === 0
    ) {

        showMessage(
            "Channel Error",
            "Channel " +
            (channel.name || "") +
            " does not contain a playlist."
        );

        return;
    }

    const position =
        calculateBroadcastPosition(
            channel
        );

    if (position) {

        currentVideoIndex =
            position.index;
    } else {

        currentVideoIndex = 0;
    }


    const video =
        channel.playlist[
            currentVideoIndex
        ];

    if (!video || !video.id) {

        showMessage(
            "Video Error",
            "The selected video does not contain a valid YouTube ID."
        );

        return;
    }

    console.log(
        "Starting channel:",
        channel.name
    );

    console.log(
        "Starting video:",
        video.id
    );

    console.log(
        "Calculated broadcast position:",
        position
    );


    player =
        new YT.Player(
            "player",
            {

                width: "100%",

                height: "100%",

                videoId:
                    video.id,

                playerVars: {

                    autoplay: 1,

                    controls: 0,

                    disablekb: 1,

                    modestbranding: 1,

                    rel: 0,

                    playsinline: 1,

                    fs: 0
                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError
                }
            }
        );
}


/* =========================================================
   PLAYER READY
   ========================================================= */

function onPlayerReady(event) {

    console.log(
        "Player ready."
    );

    event.target.mute();

    event.target.playVideo();

    updateMuteButton();

    updateOSD();

    buildEPG();

    setTimeout(
        function() {

            const channel =
                CHANNELS[
                    currentChannelIndex
                ];

            const position =
                calculateBroadcastPosition(
                    channel
                );

            if (
                position &&
                position.exact &&
                position.offset > 0
            ) {

                startupSeeking = true;

                console.log(
                    "Seeking to broadcast position:",
                    position.offset
                );

                try {

                    event.target.seekTo(
                        position.offset,
                        true
                    );

                    event.target.playVideo();

                } catch (error) {

                    console.warn(
                        "Could not seek:",
                        error
                    );
                }
            }

        },
        1500
    );
}


/* =========================================================
   PLAYER STATE CHANGES
   ========================================================= */

function onPlayerStateChange(event) {

    console.log(
        "Player state:",
        event.data
    );


    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        hideMessage();

        updateOSD();

        buildEPG();

        startupSeeking = false;
    }


    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        console.log(
            "Video ended."
        );

        playNextVideo();
    }
}


/* =========================================================
   VIDEO ERROR
   ========================================================= */

function onPlayerError(event) {

    console.warn(
        "YouTube video error:",
        event.data
    );

    showOSD(
        "Video unavailable — skipping..."
    );

    setTimeout(
        function() {

            playNextVideo();

        },
        1200
    );
}


/* =========================================================
   PLAY NEXT VIDEO
   ========================================================= */

function playNextVideo() {

    const channel =
        CHANNELS[
            currentChannelIndex
        ];

    if (
        !channel ||
        !Array.isArray(
            channel.playlist
        ) ||
        channel.playlist.length === 0
    ) {

        return;
    }


    currentVideoIndex++;

    if (
        currentVideoIndex >=
        channel.playlist.length
    ) {

        currentVideoIndex = 0;
    }


    const video =
        channel.playlist[
            currentVideoIndex
        ];

    if (!video || !video.id) {

        console.warn(
            "Invalid video entry:",
            video
        );

        playNextVideo();

        return;
    }


    console.log(
        "Loading next video:",
        video.id
    );


    if (player) {

        player.loadVideoById(
            video.id,
            0
        );
    }

    buildEPG();
}


/* =========================================================
   LOAD VIDEO WITH OPTIONAL OFFSET
   ========================================================= */

function loadVideo(index, startSeconds = 0) {

    const channel =
        CHANNELS[
            currentChannelIndex
        ];

    if (
        !channel ||
        !channel.playlist ||
        !channel.playlist.length
    ) {

        return;
    }


    currentVideoIndex =
        index;


    if (
        currentVideoIndex < 0
    ) {

        currentVideoIndex =
            channel.playlist.length - 1;
    }


    if (
        currentVideoIndex >=
        channel.playlist.length
    ) {

        currentVideoIndex = 0;
    }


    const video =
        channel.playlist[
            currentVideoIndex
        ];

    if (!video || !video.id) {

        console.warn(
            "Invalid video:",
            video
        );

        playNextVideo();

        return;
    }


    console.log(
        "Loading:",
        video.id,
        "at offset:",
        startSeconds
    );


    if (player) {

        player.loadVideoById(
            video.id,
            startSeconds
        );
    }


    updateOSD();

    buildEPG();
}


/* =========================================================
   CHANNEL SWITCHING
   ========================================================= */

function switchChannel(targetIndex) {

    if (!CHANNELS.length) return;

    if (targetIndex < 0) {
        targetIndex = CHANNELS.length - 1;
    } else if (targetIndex >= CHANNELS.length) {
        targetIndex = 0;
    }

    currentChannelIndex = targetIndex;

    const channel = CHANNELS[currentChannelIndex];
    const position = calculateBroadcastPosition(channel);

    let videoIndex = 0;
    let startSeconds = 0;

    if (position) {
        videoIndex = position.index;
        if (position.exact && position.offset > 0) {
            startSeconds = position.offset;
        }
    }

    console.log(
        "Switching to channel:",
        currentChannelIndex,
        "Video Index:",
        videoIndex,
        "Offset:",
        startSeconds
    );

    loadVideo(videoIndex, startSeconds);
}


function nextChannel() {

    switchChannel(currentChannelIndex + 1);
}


function prevChannel() {

    switchChannel(currentChannelIndex - 1);
}


/* =========================================================
   MUTE
   ========================================================= */

function toggleMute() {

    if (!player) return;

    if (player.isMuted()) {

        player.unMute();

    } else {

        player.mute();
    }

    updateMuteButton();
}


function updateMuteButton() {

    const button =
        document.getElementById(
            "mute-btn"
        );

    if (!button || !player) return;

    if (player.isMuted()) {

        button.textContent =
            "🔊 Unmute";

    } else {

        button.textContent =
            "🔇 Mute";
    }
}


/* =========================================================
   ON SCREEN DISPLAY
   ========================================================= */

function updateOSD() {

    if (!CHANNELS.length) return;

    const channel =
        CHANNELS[
            currentChannelIndex
        ];

    let title =
        "YouTube video";


    if (player) {

        try {

            const videoData =
                player.getVideoData();

            if (
                videoData &&
                videoData.title
            ) {

                title =
                    videoData.title;
            }

        } catch (error) {}
    }


    document.getElementById(
        "osd-num"
    ).textContent =
        "CH " +
        String(
            currentChannelIndex + 1
        ).padStart(2, "0");


    document.getElementById(
        "osd-name"
    ).textContent =
        channel.name ||
        "Channel";


    document.getElementById(
        "osd-title"
    ).textContent =
        title;


    showOSD();
}


function showOSD(customTitle) {

    const osd =
        document.getElementById(
            "osd"
        );

    if (customTitle) {

        document.getElementById(
            "osd-title"
        ).textContent =
            customTitle;
    }


    osd.classList.add(
        "visible"
    );


    clearTimeout(
        osdTimer
    );


    osdTimer =
        setTimeout(
            function() {

                osd.classList.remove(
                    "visible"
                );

            },
            5000
        );
}


/* =========================================================
   EPG
   ========================================================= */

function toggleEPG() {

    epgVisible =
        !epgVisible;

    const epg =
        document.getElementById(
            "epg"
        );

    if (epgVisible) {

        epg.classList.add(
            "visible"
        );

        buildEPG();

    } else {

        epg.classList.remove(
            "visible"
        );
    }
}


/* =========================================================
   FORMAT DURATION
   ========================================================= */

function formatDuration(seconds) {

    if (
        !isFinite(seconds) ||
        seconds < 0
    ) {

        return "--:--";
    }


    seconds =
        Math.floor(seconds);


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );
    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* =========================================================
   FORMAT CLOCK
   ========================================================= */

function formatClock(date) {

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );
}


/* =========================================================
   GET VIDEO TITLE
   ========================================================= */

function getVideoTitle(
    video,
    index
) {

    if (
        player &&
        index === currentVideoIndex
    ) {

        try {

            const data =
                player.getVideoData();

            if (
                data &&
                data.title
            ) {

                return data.title;
            }

        } catch (error) {}
    }


    if (
        video &&
        video.title
    ) {

        return video.title;
    }


    return (
        "Programme " +
        (index + 1)
    );
}


/* =========================================================
   BUILD EPG
   ========================================================= */

function buildEPG() {

    const container =
        document.getElementById(
            "epg-content"
        );

    if (!container) return;

    container.innerHTML = "";

    if (!CHANNELS.length) return;


    CHANNELS.forEach(
        function(
            channel,
            channelIndex
        ) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "epg-row";


            if (
                channelIndex ===
                currentChannelIndex
            ) {

                row.classList.add(
                    "current"
                );
            }


            /* CHANNEL HEADER */

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "epg-channel-header";


            const channelName =
                document.createElement(
                    "div"
                );

            channelName.className =
                "epg-channel-name";

            channelName.textContent =
                channel.name ||
                "Channel";


            const channelNumber =
                document.createElement(
                    "div"
                );

            channelNumber.className =
                "epg-channel-number";

            channelNumber.textContent =
                "CH " +
                String(
                    channelIndex + 1
                ).padStart(2, "0");


            header.appendChild(
                channelName
            );

            header.appendChild(
                channelNumber
            );

            row.appendChild(
                header
            );


            /* PROGRAMMES */

            const programmes =
                document.createElement(
                    "div"
                );

            programmes.className =
                "epg-programmes";


            let startIndex = 0;

            if (
                channelIndex ===
                currentChannelIndex
            ) {

                startIndex =
                    currentVideoIndex;
            }


            const count =
                channel.playlist.length;


            for (
                let displayIndex = 0;
                displayIndex < count;
                displayIndex++
            ) {

                const videoIndex =
                    (
                        startIndex +
                        displayIndex
                    ) % count;


                const video =
                    channel.playlist[
                        videoIndex
                    ];


                const duration = Number(video.duration) || 0;


                const programme =
                    document.createElement(
                        "div"
                    );

                programme.className =
                    "epg-programme";


                const isCurrent =
                    channelIndex ===
                    currentChannelIndex &&
                    videoIndex ===
                    currentVideoIndex;


                if (isCurrent) {

                    programme.classList.add(
                        "now"
                    );
                }


                /* TIME */

                const time =
                    document.createElement(
                        "div"
                    );

                time.className =
                    "epg-time";


                if (
                    isCurrent &&
                    player
                ) {

                    let currentTime = 0;

                    try {

                        currentTime =
                            player.getCurrentTime();

                    } catch (error) {}


                    if (duration > 0) {

                        const remaining =
                            Math.max(
                                0,
                                duration -
                                currentTime
                            );

                        time.textContent =
                            formatDuration(
                                remaining
                            ) +
                            " left";

                    } else {

                        time.textContent =
                            "NOW";
                    }

                } else if (
                    duration > 0
                ) {

                    time.textContent =
                        formatDuration(
                            duration
                        );

                } else {

                    time.textContent =
                        "TBA";
                }


                /* INFO */

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "epg-programme-info";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "epg-programme-title";

                title.textContent =
                    getVideoTitle(
                        video,
                        videoIndex
                    );


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "epg-programme-meta";


                if (duration > 0) {

                    meta.textContent =
                        formatDuration(
                            duration
                        );

                } else {

                    meta.textContent =
                        "Unknown duration";
                }


                info.appendChild(
                    title
                );

                info.appendChild(
                    meta
                );


                /* NOW / NEXT */

                const label =
                    document.createElement(
                        "div"
                    );

                label.className =
                    "epg-now";


                if (isCurrent) {

                    label.textContent =
                        "▶ NOW";

                } else if (
                    displayIndex === 1
                ) {

                    label.textContent =
                        "NEXT";
                }


                /* PROGRESS */

                if (
                    isCurrent &&
                    player &&
                    duration > 0
                ) {

                    let currentTime = 0;

                    try {

                        currentTime =
                            player.getCurrentTime();

                    } catch (error) {}


                    const percentage =
                        Math.min(
                            100,
                            (
                                currentTime /
                                duration
                            ) * 100
                        );


                    const progress =
                        document.createElement(
                            "div"
                        );

                    progress.className =
                        "epg-progress";

                    progress.style.width =
                        percentage +
                        "%";


                    programme.appendChild(
                        progress
                    );
                }


                programme.appendChild(
                    time
                );

                programme.appendChild(
                    info
                );

                programme.appendChild(
                    label
                );


                programmes.appendChild(
                    programme
                );
            }


            row.appendChild(
                programmes
            );


            /* CLICK CHANNEL */

            header.addEventListener(
                "click",
                function() {

                    switchChannel(channelIndex);

                    toggleEPG();
                }
            );


            container.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   LIVE EPG UPDATE
   ========================================================= */

setInterval(
    function() {

        updateClock();

        if (epgVisible) {

            buildEPG();
        }

    },
    1000
);


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {

    const clock =
        document.getElementById(
            "epg-clock"
        );

    if (!clock) return;

    clock.textContent =
        formatClock(
            new Date()
        );
}


/* =========================================================
   MESSAGES
   ========================================================= */

function showMessage(
    title,
    text
) {

    document.getElementById(
        "message-title"
    ).textContent =
        title;

    document.getElementById(
        "message-text"
    ).innerHTML =
        text;

    document.getElementById(
        "message"
    ).classList.remove(
        "hidden"
    );
}


function hideMessage() {

    document.getElementById(
        "message"
    ).classList.add(
        "hidden"
    );
}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowUp"
        ) {

            prevChannel();

        } else if (
            event.key ===
            "ArrowDown"
        ) {

            nextChannel();

        } else if (
            event.key.toLowerCase() ===
            "m"
        ) {

            toggleMute();

        } else if (
            event.key.toLowerCase() ===
            "g"
        ) {

            toggleEPG();

        } else if (
            event.key ===
            "Escape" &&
            epgVisible
        ) {

            toggleEPG();
        }
    }
);


/* =========================================================
   START
   ========================================================= */

updateClock();

loadChannels();

</script>
